<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1320">
<title>LogiGo SuperApp - All-In-One Delivery, Taxi & E-Commerce Engine</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
:root {
  --bg-main: #0b1320;
  --bg-card: #132238;
  --bg-input: #1b2f4c;
  --accent-green: #00e676;
  --accent-orange: #ff9100;
  --accent-blue: #29b6f6;
  --accent-red: #ff5252;
  --text-main: #f0f4f8;
  --text-muted: #90a4ae;
  --border-color: #243b5e;
}

* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-main);
  color: var(--text-main);
  margin: 0;
  padding: 12px;
  min-height: 100vh;
}

.lang-bar {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-bottom: 8px;
}
.lang-btn {
  padding: 4px 8px;
  font-size: 11px;
  font-weight: bold;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-muted);
  border-radius: 4px;
  cursor: pointer;
}
.lang-btn.active {
  background: var(--accent-blue);
  color: #000;
  border-color: var(--accent-blue);
}

header {
  text-align: center;
  margin-bottom: 12px;
}
header h1 {
  margin: 0;
  font-size: 22px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
header p {
  margin: 4px 0 0;
  font-size: 11px;
  color: var(--accent-blue);
  letter-spacing: 0.5px;
}

.nav-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
}
.tab-btn {
  flex: 1;
  padding: 8px 2px;
  font-size: 10px;
  font-weight: bold;
  background: var(--bg-card);
  color: var(--text-muted);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
}
.tab-btn.active {
  background: var(--accent-blue);
  color: #000;
  border-color: var(--accent-blue);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 8px;
  text-align: center;
}
.kpi-card .val { font-size: 16px; font-weight: bold; margin-bottom: 2px; }
.kpi-card .lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }

.form-box {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
}

.row { display: flex; gap: 8px; margin-bottom: 8px; }
.col { flex: 1; min-width: 0; }
.form-group { margin-bottom: 8px; position: relative; }
label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
input, select, textarea {
  width: 100%;
  padding: 10px;
  font-size: 13px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--bg-input);
  color: var(--text-main);
}

.suggestions-box {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #1b2f4c;
  border: 1px solid var(--accent-blue);
  border-radius: 0 0 6px 6px;
  z-index: 99;
  max-height: 150px;
  overflow-y: auto;
  display: none;
}
.suggestion-item {
  padding: 8px 10px;
  font-size: 12px;
  cursor: pointer;
  border-bottom: 1px solid #243b5e;
}
.suggestion-item:hover {
  background: #29b6f6;
  color: #000;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 12px;
  font-weight: bold;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-scan { background: #5c6bc0; color: white; }
.btn-add { background: var(--accent-green); color: #000; }
.btn-excel { background: #2e7d32; color: white; }
.btn-share { background: #0288d1; color: white; }
.btn-del { background: var(--accent-red); color: white; }
.btn-call { background: #00c853; color: white; }
.btn-wa { background: #25d366; color: white; }
.btn-shop { background: #ff9100; color: #000; }
.btn-grab { background: #00b14f; color: white; }
.btn-xanh { background: #003366; color: white; }

.alert {
  text-align: center;
  color: var(--accent-orange);
  font-weight: bold;
  font-size: 12px;
  min-height: 20px;
  margin: 6px 0;
}

.table-wrap { width: 100%; overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; background: var(--bg-card); font-size: 11px; }
th, td { border: 1px solid var(--border-color); padding: 8px 6px; text-align: center; }
th { background: #1a2d48; color: var(--text-main); }
.status-pill {
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: bold;
  text-transform: uppercase;
}
.st-picked { background: #0288d1; color: white; }
.st-transit { background: #f57c00; color: white; }
.st-deliv { background: #2e7d32; color: white; }
.st-fail { background: #c62828; color: white; }

.shop-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.shop-card {
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}
.shop-card h4 { margin: 0 0 4px; font-size: 12px; color: var(--text-main); }

#exportModal {
  display: none;
  background: rgba(0,0,0,0.95);
  position: fixed;
  inset: 0;
  padding: 15px 10px;
  overflow-y: auto;
  z-index: 1000;
  text-align: center;
}
textarea.report-box {
  width: 100%;
  height: 180px;
  background: var(--bg-main);
  color: var(--accent-green);
  font-family: monospace;
  font-size: 11px;
  margin-bottom: 10px;
}

/* Radar & GPS Dispatch Canvas Styles */
#taxiMapCanvas {
  width: 100%;
  height: 180px;
  background: #050c18;
  border: 1px solid var(--accent-blue);
  border-radius: 8px;
  display: block;
  margin-bottom: 10px;
}
.driver-card {
  background: var(--bg-input);
  border: 1px dashed var(--accent-blue);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="lang-bar no-print">
  <button class="lang-btn active" id="langBtnEn" onclick="setLanguage('en')">🇬🇧 EN</button>
  <button class="lang-btn" id="langBtnVi" onclick="setLanguage('vi')">🇻🇳 VN</button>
  <button class="lang-btn" id="langBtnZh" onclick="setLanguage('zh')">🇨🇳 中文</button>
</div>

<header class="no-print">
  <h1>🚀 LogiGo SuperApp</h1>
  <p id="companyTaglineHeader">LOGISTICS, RIDE-HAILING & E-COMMERCE ENGINE</p>
</header>

<div class="nav-tabs no-print">
  <button class="tab-btn active" id="tabScannerBtn" onclick="switchTab('scanner')">📦 Manifest</button>
  <button class="tab-btn" id="tabMarketBtn" onclick="switchTab('market')">🛒 E-Shop & Rides</button>
  <button class="tab-btn" id="tabSupportBtn" onclick="switchTab('support')">🎧 Support</button>
  <button class="tab-btn" id="tabAdminBtn" onclick="switchTab('admin')">⚙️ Control</button>
</div>

<!-- SECTION 1: MANIFEST & SCANNER -->
<div id="sectionScanner" class="app-section">
  <div class="kpi-grid no-print">
    <div class="kpi-card"><div class="val" id="kpiTotal">0</div><div class="lbl" id="lblKpiTotal">TOTAL</div></div>
    <div class="kpi-card"><div class="val" style="color:var(--accent-blue)" id="kpiPicked">0</div><div class="lbl" id="lblKpiPicked">PICKED UP</div></div>
    <div class="kpi-card"><div class="val" style="color:var(--accent-orange)" id="kpiTransit">0</div><div class="lbl" id="lblKpiTransit">IN TRANSIT</div></div>
    <div class="kpi-card"><div class="val" style="color:var(--accent-green)" id="kpiDelivered">0</div><div class="lbl" id="lblKpiDelivered">DELIVERED</div></div>
  </div>

  <div id="alertBox" class="alert no-print">Ready for scanning. High-Precision Barcode Engine Loaded.</div>

  <div class="form-box no-print">
    <div class="row">
      <div class="col form-group">
        <label for="driverName" id="lblDriver">Driver / Officer</label>
        <input id="driverName" value="Driver #104" maxlength="60">
      </div>
      <div class="col form-group">
        <label for="vehicleId" id="lblVehicle">Vehicle / Route ID</label>
        <input id="vehicleId" value="VAN-59B" maxlength="60">
      </div>
    </div>

    <button class="btn-scan" id="startScanBtn" onclick="startCameraScanner()">📷 OPEN CAMERA SCANNER</button>
    <button class="btn-del" id="stopScanBtn" onclick="stopCameraScanner()" style="display:none">✕ STOP CAMERA</button>

    <div id="cameraPanel" style="display:none;margin-top:8px;background:#050c18;padding:8px;border-radius:8px">
      <video id="cameraVideo" playsinline muted autoplay style="width:100%;max-height:280px;object-fit:cover;background:#000;border:2px solid var(--accent-blue);border-radius:6px"></video>
      <div style="font-size:10px;color:var(--accent-orange);text-align:center;margin-top:4px">Hold barcode steadily inside video frame...</div>
    </div>

    <div class="row" style="margin-top:10px">
      <div class="col form-group">
        <label for="trackingCode" id="lblTracking">Waybill / Tracking Barcode</label>
        <input id="trackingCode" placeholder="Scan tracking barcode..." autocomplete="off">
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label for="itemDescription" id="lblItemDesc">Package Item / Product Type</label>
        <input id="itemDescription" placeholder="e.g. Electronics / Documents / Cargo">
      </div>
      <div class="col form-group">
        <label for="recipient" id="lblRecipient">Customer / Recipient Name</label>
        <input id="recipient" placeholder="Customer name or hub">
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label for="statusSelect" id="lblStatus">Delivery Status</label>
        <select id="statusSelect">
          <option value="PICKED_UP" id="optPicked">Picked Up</option>
          <option value="IN_TRANSIT" id="optTransit" selected>In Transit</option>
          <option value="DELIVERED" id="optDelivered">Delivered</option>
          <option value="FAILED" id="optFailed">Delivery Exception</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="gpsField" id="lblGps">GPS Location / Terminal Tag</label>
      <div class="row" style="margin-bottom:0">
        <input id="gpsField" placeholder="Auto-captured or tap to type location...">
        <button type="button" style="width:110px;background:#37474f;color:white" onclick="captureGPS()">📍 GPS</button>
      </div>
    </div>

    <button class="btn-add" id="saveBtn" onclick="addShipment()">➕ LOG SHIPMENT TO MANIFEST</button>
  </div>

  <!-- LogiGo Live GPS Widget Card -->
  <div id="logigo-live-gps" class="form-box no-print" style="margin-bottom:12px;">
    <h3 style="margin-top:0;margin-bottom:8px;font-size:14px;color:var(--accent-blue)">📍 LogiGo Live GPS</h3>
    <p style="margin:4px 0;font-size:11px;">Status: <strong id="lgps-status" style="color:var
